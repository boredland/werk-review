name: Sheets → JSON Sync

on:
  schedule:
    - cron: '0 8-22 * * *'
  workflow_dispatch:
  
concurrency:
  group: sheets-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CONCURRENCY: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync from Google Sheets
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node scripts/sheets-sync.mjs

      - name: Enrich with external links and Wikipedia data
        env:
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
          GEMINI_PROXY_SECRET: ${{ secrets.GEMINI_PROXY_SECRET }}
        run: |
          node scripts/enrich-links.mjs &
          links_pid=$!
          node scripts/enrich-wikipedia.mjs &
          wikipedia_pid=$!
          fail=0
          wait "$links_pid" || fail=1
          wait "$wikipedia_pid" || fail=1
          exit "$fail"

      - name: Check for changes
        id: changes
        run: |
          git add -A data/
          git diff --staged --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "sync: update data from Google Sheets"
          git push
